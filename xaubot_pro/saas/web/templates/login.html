<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - XAUBOT Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--border:#1e1e2e;--gold:#d4af37;--goldDark:#b8962e;--text:#e0e0e0;--muted:#888;--input:#1a1a2e;--input-text:#fff;--error-bg:#3d1515;--error-border:#6b2020;--error-text:#ff6b6b}
@media(prefers-color-scheme:light){
:root{--bg:#f8f7f4;--card:#ffffff;--border:#e0e0e6;--gold:#b8962e;--goldDark:#9a7d24;--text:#1a1a2e;--muted:#666;--input:#f0f0f5;--input-text:#1a1a2e;--error-bg:#fef2f2;--error-border:#fecaca;--error-text:#dc2626}
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px;margin:20px;box-shadow:0 4px 24px rgba(0,0,0,.1)}
.logo{text-align:center;margin-bottom:30px}
.logo h1{color:var(--gold);font-size:28px;letter-spacing:2px}
.logo p{color:var(--muted);font-size:14px;margin-top:4px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px;margin-top:16px}
input[type=email],input[type=password]{width:100%;padding:12px 16px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--input-text);font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:var(--gold)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--goldDark));color:#000;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:24px;transition:opacity .2s}
.btn:hover{opacity:.9}
.error{background:var(--error-bg);border:1px solid var(--error-border);color:var(--error-text);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:16px}
.links{text-align:center;margin-top:20px;font-size:14px;color:var(--muted)}
.links a{color:var(--gold);text-decoration:none}
.links a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>XAUBOT PRO</h1>
        <p>Automated Gold Trading</p>
    </div>
    <form method="POST" action="/login">
        <label>Email</label>
        <input type="email" name="email" required placeholder="your@email.com" autocomplete="email">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter password" autocomplete="current-password">
        <button type="submit" class="btn">Sign In</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div class="links">
        Don't have an account? <a href="/register">Sign Up</a>
    </div>
</div>
</body>
</html>
