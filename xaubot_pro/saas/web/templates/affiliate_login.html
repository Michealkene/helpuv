<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Login - XAUBOT Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--border:#1e1e2e;--gold:#d4af37;--goldDark:#b8962e;--text:#e0e0e0;--muted:#888;--input:#1a1a2e;--input-text:#fff;--error-bg:#3d1515;--error-border:#f87171;--error-text:#f87171}
@media(prefers-color-scheme:light){
:root{--bg:#f8f7f4;--card:#ffffff;--border:#e0e0e6;--gold:#b8962e;--goldDark:#9a7d24;--text:#1a1a2e;--muted:#666;--input:#f0f0f5;--input-text:#1a1a2e;--error-bg:#fef2f2;--error-border:#fecaca;--error-text:#dc2626}
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px;margin:20px;box-shadow:0 4px 24px rgba(0,0,0,.1)}
h1{color:var(--gold);font-size:22px;margin-bottom:8px;text-align:center}
.sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
input{width:100%;padding:12px 14px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--input-text);font-size:14px;outline:none}
input:focus{border-color:var(--gold)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--goldDark));color:#000;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.9}
.error{background:var(--error-bg);border:1px solid var(--error-border);color:var(--error-text);padding:10px;border-radius:8px;margin-bottom:16px;font-size:13px}
.links{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.links a{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
    <h1>Affiliate Login</h1>
    <p class="sub">Access your affiliate dashboard.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/affiliate/login">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn">Login</button>
    </form>

    <div class="links">
        Not an affiliate? <a href="/affiliate/register">Sign Up</a> | <a href="/">Back to Home</a>
    </div>
</div>
</body>
</html>
