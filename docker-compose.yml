services:
  postgres:
    image: postgres:15
    container_name: helpuvio_postgres
    environment:
      POSTGRES_DB: helpuvio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - helpuvio
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: helpuvio_redis
    networks:
      - helpuvio
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpuvio_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/helpuvio
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-helpuvio-datasets}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@helpuvio.com}
      FRONTEND_URL: https://helpuvio.com
      SMTP_VERIFY_FROM_EMAIL: ${SMTP_VERIFY_FROM_EMAIL:-verify@helpuvio.com}
      SMTP_VERIFY_DOMAIN: ${SMTP_VERIFY_DOMAIN:-helpuvio.com}
    depends_on:
      - postgres
      - redis
    networks:
      - helpuvio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.helpuvio.com
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
    container_name: helpuvio_frontend
    networks:
      - helpuvio
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: helpuvio_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - helpuvio
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: helpuvio_certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - helpuvio

volumes:
  postgres_data:

networks:
  helpuvio:
    driver: bridge