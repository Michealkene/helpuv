version: '3.8'

services:
  openclaw-instance3:
    image: node:22-bookworm
    container_name: openclaw-instance3
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=production
      - OPENCLAW_HOME=/app/.openclaw
      - OPENCLAW_PORT=18791
      - OPENCLAW_INSTANCE=instance3
    env_file:
      - .env
    ports:
      - "18791:18791"
    volumes:
      - ./config:/app/.openclaw
      - ./workspace:/app/workspace
      - openclaw-instance3-data:/app/data
    command: >
      bash -c "
        npm install -g openclaw@latest &&
        openclaw gateway --port 18791 --bind 0.0.0.0 --allow-unconfigured
      "
    networks:
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18791/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  openclaw-instance3-data:
    driver: local

networks:
  openclaw-network:
    driver: bridge
