version: '3.8'

services:
  openclaw-instance2:
    image: node:22-bookworm
    container_name: openclaw-instance2
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=production
      - OPENCLAW_HOME=/app/.openclaw
      - OPENCLAW_PORT=18790
      - OPENCLAW_INSTANCE=instance2
    env_file:
      - .env
    ports:
      - "18790:18790"
    volumes:
      - ./config:/app/.openclaw
      - ./workspace:/app/workspace
      - openclaw-instance2-data:/app/data
    command: >
      bash -c "
        npm install -g openclaw@latest &&
        openclaw gateway --port 18790 --bind 0.0.0.0 --allow-unconfigured
      "
    networks:
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18790/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  openclaw-instance2-data:
    driver: local

networks:
  openclaw-network:
    driver: bridge
